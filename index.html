<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무한매수V4</title>
  <style>
    /* 기본 스타일링 */
    body { font-family: sans-serif; padding: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .btn-price-status { cursor: pointer; padding: 2px 8px; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
    .btn-price-status:hover { background: #e0e0e0; }
  </style>
</head>
<body>

  <!-- 진행현황 영역 -->
  <div class="card">
    <h3>진행현황</h3>
    <div>
      현재가: <strong id="current-price">0.00</strong>
      <button id="price-source-btn" class="btn-price-status" onclick="fetchPrice(true)">[갱신]</button>
    </div>
    <div style="margin-top: 10px;">
      <p>보유수량: <span id="hold-qty">0</span> 주</p>
      <p>매수금액: <span id="buy-amount">0.00</span></p>
      <p>평가금액: <span id="eval-amount">0.00</span> (<span id="return-rate">0.00%</span>)</p>
    </div>
  </div>

  <script>
    // 현재가를 가져오는 종목 티커 (기본값: SOXL, 필요시 변경)
    const SYMBOL = "SOXL";

    /**
     * 야후 파이낸스 API + CORS 프록시를 이용한 현재가 조회 함수
     * @param {boolean} isManual 버튼 직접 클릭 여부
     */
    async function fetchPrice(isManual = false) {
      const priceBtn = document.getElementById("price-source-btn");
      if (priceBtn) priceBtn.innerText = "[조회중...]";

      // 야후 파이낸스 API URL 및 CORS 프록시 서비스 URL 설정
      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${SYMBOL}?interval=1m&range=1d`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`HTTP 에러: ${response.status}`);

        const data = await response.json();
        const parsedData = JSON.parse(data.contents);

        // API 응답 데이터에서 현재가(또는 종가) 추출
        const result = parsedData.chart.result[0];
        const currentPrice = result.meta.regularMarketPrice || result.meta.chartPreviousClose;

        if (currentPrice) {
          // 1. 현재가 화면에 표시
          document.getElementById("current-price").innerText = currentPrice.toFixed(2);

          // 2. 보유수량이 있는 경우 평가금액 및 수익률 재계산 (예시)
          updateCalculations(currentPrice);

          if (isManual) {
            alert(`현재가가 성공적으로 갱신되었습니다: $${currentPrice.toFixed(2)}`);
          }
        } else {
          throw new Error("가격 데이터를 찾을 수 없습니다.");
        }
      } catch (error) {
        console.error("현재가 갱신 실패:", error);
        alert("현재가를 불러오는 중 오류가 발생했습니다. 브라우저 콘솔(F12)을 확인해 주세요.");
      } finally {
        if (priceBtn) priceBtn.innerText = "[갱신]";
      }
    }

    /**
     * 현재가 변경에 따른 평가금액 및 수익률 계산 함수
     */
    function updateCalculations(price) {
      const holdQty = parseFloat(document.getElementById("hold-qty").innerText) || 0;
      const buyAmount = parseFloat(document.getElementById("buy-amount").innerText) || 0;

      const evalAmount = holdQty * price;
      document.getElementById("eval-amount").innerText = evalAmount.toFixed(2);

      if (buyAmount > 0) {
        const returnRate = ((evalAmount - buyAmount) / buyAmount) * 100;
        document.getElementById("return-rate").innerText = `${returnRate.toFixed(2)}%`;
      }
    }

    // 페이지 로드 시 자동으로 1회 현재가 조회
    window.addEventListener("DOMContentLoaded", () => {
      fetchPrice(false);
    });
  </script>
</body>
</html>
